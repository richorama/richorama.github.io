# Site settings
title:       Richard Astbury's Blog
email:       richard.astbury@gmail.com
author:      Richard Astbury
description: "Richard Astbury writes about software engineering, cloud architecture, AI, mapping, Microsoft Azure, and developer tools."
baseurl:     ""
url:         "https://richorama.github.io"
lang:        en-GB
repository:  richorama/richorama.github.io

# Google analytics
google_analytics:

# Optional features
animated:           false
show_related_posts: false
show_post_footers:  false

# Social icons
show_social_icons: false
github_username: richorama
twitter_username: richorama
google_plus_id:
linkedin_username:
bitcoin_url:
paypal_url:
flattr_button:

# Build settings
markdown:     kramdown
permalink:    pretty
paginate:     20
sass:
  compressed: true
relative_links:
  enabled: false
defaults:
  - scope:
      path: "markdown"
    values:
      sitemap: false

plugins:
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="{{ site.author }}" />
  {% if page.categories %}
  <meta name="keywords" content="{{ page.categories | join: ', ' }}" />
  {% endif %}

  <link
    rel="stylesheet"
    href="{{ "/css/pixyll.css" | prepend: site.baseurl }}"
    type="text/css"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  {% if site.show_social_icons %}
  <link
    href="//maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css"
    rel="stylesheet"
  />
  {% endif %}

  <meta property="og:locale" content="en_US" />
  <link
    rel="alternate"
    type="application/rss+xml"
    title="RSS feed for richorama.github.com"
    href="/rss.xml"
  />
  <link
    rel="alternate"
    type="application/atom+xml"
    title="Atom feed for richorama.github.com"
    href="/atom.xml"
  />

  <script>
    MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  {% seo %}
</head>
